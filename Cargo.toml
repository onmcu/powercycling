[package]
name = "powercycling"
version = "0.0.1"
edition = "2024"
description = "Power-cycle a USB device by VID:PID:serial via hub per-port power switching (PPPS)"
repository = "https://github.com/onmcu/powercycling"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["usb", "hub", "ppps", "power-cycle", "hil"]
categories = ["hardware-support", "os::linux-apis"]

[package.metadata.docs.rs]
# Linux-only crate; the docs are the same on every Linux target.
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
rusb = { version = "0.9.4", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
